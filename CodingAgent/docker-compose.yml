services:
  # ── Layer 0: secrets-init — token rotation on each boot ──────────────
  secrets-init:
    image: alpine:3.19
    container_name: codingagent-secrets-init
    command: ["/bin/sh", "/secrets-init.sh"]
    environment:
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN}
    volumes:
      - secrets-vol:/run/secrets
      - ./security/secrets-init.sh:/secrets-init.sh:ro
      - ./config/openclaw.json:/config-template/openclaw.json:ro
      - config-vol:/openclaw-config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    restart: "no"
    networks:
      - codingagent-net

  # ── OpenClaw 2.0 config/auth migration ─────────────────────────────
  openclaw-init:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.8.1}
    container_name: codingagent-openclaw-init
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    command: ["node", "/app/openclaw.mjs", "doctor", "--fix"]
    environment:
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN}
      GH_TOKEN: ${COPILOT_GITHUB_TOKEN}
      HOME: /home/node
    volumes:
      - config-vol:/home/node/.openclaw:rw
    restart: "no"
    networks:
      - codingagent-net

  # ── Reproducible Python test runtime ────────────────────────────────
  pytest-init:
    image: python:3.12-slim
    container_name: codingagent-pytest-init
    command:
      - python
      - -m
      - pip
      - install
      - --disable-pip-version-check
      - --no-cache-dir
      - --index-url
      - https://packagefeedproxy.microsoft.io/pypi/simple
      - --target
      - /opt/pytest
      - pytest==8.3.5
    volumes:
      - pytest-vol:/opt/pytest
    restart: "no"
    networks:
      - codingagent-net

  # ── OpenClaw Gateway ──────────────────────────────────────────────────
  openclaw:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.8.1}
    container_name: codingagent-openclaw
    depends_on:
      openclaw-init:
        condition: service_completed_successfully
      pytest-init:
        condition: service_completed_successfully
    ports:
      - "18790:18789"
    environment:
      OPENCLAW_TOKEN_FILE: /run/secrets/gateway-token
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN}
      GH_TOKEN: ${COPILOT_GITHUB_TOKEN}
      HOME: /home/node
    volumes:
      - config-vol:/home/node/.openclaw:rw
      - ./workspace:/home/node/.openclaw/workspace:rw
      - secrets-vol:/run/secrets:ro
      - pytest-vol:/opt/pytest:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18789/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - codingagent-net

  # ── Harness orchestrator ─────────────────────────────────────────────
  harness:
    build:
      context: .
      dockerfile: harness/Dockerfile
    container_name: codingagent-harness
    depends_on:
      openclaw:
        condition: service_healthy
    environment:
      OPENCLAW_GATEWAY: http://openclaw:18789
      OPENCLAW_TOKEN_FILE: /run/secrets/gateway-token
      OPENCLAW_CONTAINER: codingagent-openclaw
      MAX_ITERATIONS: ${MAX_ITERATIONS:-4}
    volumes:
      - ./harness:/app:ro
      - ./workspace:/workspace:rw
      - secrets-vol:/run/secrets:ro
      # This is the Docker Sandbox microVM daemon socket, never the host socket.
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command: ["python", "-u", "orchestrator.py"]
    restart: "no"
    networks:
      - codingagent-net

volumes:
  config-vol:
  pytest-vol:
  secrets-vol:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,uid=0,gid=0,mode=0700"

networks:
  codingagent-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
